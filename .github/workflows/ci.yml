# CI security gates (acceptance: specs/ci-gates.feature.md). Every gate must pass.
name: CI

# Branch pushes are covered by their pull request; `main` runs on push (merges).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every run on main completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned by package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # @electron/get's download cache (checksum-verified on use), keyed on the lockfile's Electron.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Also fetches Electron's binary (@app/desktop postinstall runs `install-electron`).
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: "Gate: lint-test-build"
        id: build
        run: pnpm turbo run lint test build

      - name: "Gate: electronegativity"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm security:electronegativity

      # Semgrep runs via uvx at the version pinned in package.json (same command as locally).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          version: 0.12.1

      - name: "Gate: semgrep-rule-test"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm security:semgrep:test

      - name: "Gate: semgrep-repo-scan"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm security:semgrep:scan

      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs.
      # Allow them instead of weakening the app: Electron runs with its sandbox on (no --no-sandbox).
      - name: Allow unprivileged user namespaces (Chromium sandbox)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: "Gate: e2e"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          xvfb-run -a pnpm --filter @app/desktop test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
