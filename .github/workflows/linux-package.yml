# Linux packages (acceptance: specs/linux-package.feature.md). Packages the app for x64 as an
# AppImage, a deb and a zip, verifies them (verify-linux-package.mjs) and uploads the AppImage + deb.
# Lint, tests and e2e run on Linux in ci.yml already.
name: Linux package

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'specs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.github/workflows/linux-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every run on main completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned by package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # @electron/get's download cache (checksum-verified on use), keyed on the lockfile's Electron.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Also fetches Electron's binary (@app/desktop postinstall runs `install-electron`).
      - name: Install
        run: pnpm install --frozen-lockfile

      # mksquashfs for the AppImage maker, unzip for the zip check, Xvfb for the launch checks.
      # dpkg-deb (the deb maker and the deb checks) is part of the runner image.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools unzip xvfb

      - name: Build
        id: build
        run: pnpm --filter @app/desktop build

      # Unsigned: frost has no Linux repository key (specs/linux-package.spec.ts).
      - name: Make (AppImage + deb + zip, x64)
        id: make
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm make:linux

      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs.
      # Allow them instead of weakening the app: the packaged app runs with its sandbox on. (So this
      # run does not show the AppImage starts on a stock 24.04: specs/linux-package.feature.md.)
      - name: Allow unprivileged user namespaces (Chromium sandbox)
        if: ${{ !cancelled() && steps.make.outcome == 'success' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify package
        id: verify
        if: ${{ !cancelled() && steps.make.outcome == 'success' }}
        run: xvfb-run -a pnpm verify:linux

      # Only packages that passed verify are published.
      - name: Upload AppImage + deb
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frost-linux-x64
          path: |
            apps/desktop/out/make/AppImage/x64/*.AppImage
            apps/desktop/out/make/deb/x64/*.deb
          if-no-files-found: error
          retention-days: 7
